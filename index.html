<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            background: #23272f;
            color: #f5f6fa;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 440px;
            margin: 40px auto;
            background: #2c313a;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.2);
            padding: 32px 28px 24px 28px;
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #ffb347;
            letter-spacing: 1px;
        }
        h2 {
            color: #ffcc80;
            font-size: 1rem;
            margin-top: 28px;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #353b48;
            padding-bottom: 6px;
        }
        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #23272f;
            color: #f5f6fa;
            font-size: 1rem;
            margin-bottom: 8px;
            box-sizing: border-box;
            transition: border 0.2s;
        }
        input[type="number"]:focus, input[type="text"]:focus {
            border: 1.5px solid #ffb347;
            outline: none;
        }
        input[readonly] {
            cursor: pointer;
            color: #b2bec3;
            font-size: 0.85rem;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #ffb347 0%, #ffcc80 100%);
            color: #23272f;
            border: none;
            border-radius: 6px;
            font-size: 1.05rem;
            font-weight: bold;
            margin-top: 12px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg, #ffcc80 0%, #ffb347 100%);
            color: #1a1a1a;
        }
        button.btn-secondary {
            background: #353b48;
            color: #ffcc80;
            font-size: 0.95rem;
            padding: 10px;
        }
        button.btn-secondary:hover {
            background: #444b5a;
            color: #ffe082;
        }
        button.btn-success {
            background: linear-gradient(90deg, #00b894, #55efc4);
            color: #1a1a1a;
        }
        button.btn-success:hover {
            background: linear-gradient(90deg, #55efc4, #00b894);
        }
        .btn-row {
            display: flex;
            gap: 8px;
        }
        .btn-row button {
            flex: 1;
        }
        .fichas-lista {
            margin-top: 12px;
        }
        .ficha-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #353b48;
            border-radius: 5px;
            padding: 8px 12px;
            margin-bottom: 6px;
            color: #ffe082;
            font-size: 1rem;
        }
        .ficha-item .remove-btn {
            background: none;
            border: none;
            color: #ff7675;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 4px;
            margin: 0;
            width: auto;
            line-height: 1;
        }
        .ficha-item .remove-btn:hover {
            color: #d63031;
            background: none;
        }
        .jogadores-lista {
            margin-top: 12px;
        }
        .jogador-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .jogador-row input[type="text"] {
            flex: 1.2;
            margin-bottom: 0;
        }
        .jogador-row input[type="number"] {
            flex: 1;
            margin-bottom: 0;
        }
        .jogador-row .jogador-label {
            font-size: 0.85rem;
            color: #b2bec3;
            white-space: nowrap;
        }
        .total {
            background: #23272f;
            border-radius: 8px;
            padding: 16px 12px;
            margin-top: 18px;
            color: #b2bec3;
            font-size: 1.05rem;
        }
        .total p {
            color: #ffb347;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .total .jogador-resultado {
            background: #2c313a;
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }
        .total .jogador-resultado .nome {
            color: #ffcc80;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .total .jogador-resultado .detalhe {
            color: #b2bec3;
            font-size: 0.95rem;
        }
        .compartilhar-box {
            margin-top: 16px;
            background: #23272f;
            border-radius: 8px;
            padding: 14px 12px;
        }
        .link-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
        }
        .link-row input {
            flex: 1;
            margin-bottom: 0;
            font-size: 0.8rem;
        }
        .link-row button {
            width: auto;
            flex-shrink: 0;
            padding: 10px 14px;
            font-size: 0.9rem;
            margin-top: 0;
        }
        #qr-wrapper {
            display: none;
            margin-top: 16px;
            text-align: center;
        }
        #qr-wrapper.visible {
            display: block;
        }
        #qr-container {
            display: inline-block;
            background: #f5f6fa;
            padding: 12px;
            border-radius: 8px;
        }
        .toast {
            display: none;
            background: #00b894;
            color: #1a1a1a;
            font-weight: 600;
            text-align: center;
            border-radius: 6px;
            padding: 8px 12px;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .toast.show {
            display: block;
            animation: fadeout 2s forwards;
        }
        @keyframes fadeout {
            0%   { opacity: 1; }
            70%  { opacity: 1; }
            100% { opacity: 0; }
        }
        @media (max-width: 500px) {
            .container { padding: 16px 6vw 12px 6vw; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Gerenciador de Fichas de Poker</h1>

    <!-- MALETA -->
    <h2>Fichas da maleta</h2>
    <label for="valor-add">Valor da ficha</label>
    <input type="number" placeholder="Ex: 50" id="valor-add" min="1">

    <label for="qtd-add">Quantidade de fichas</label>
    <input type="number" placeholder="Ex: 40" id="qtd-add" min="1">

    <button onclick="adicionarFicha()">Adicionar ficha</button>

    <div class="fichas-lista" id="fichas-lista"></div>

    <!-- COMPARTILHAR -->
    <h2>Compartilhar maleta</h2>
    <div class="compartilhar-box">
        <div class="btn-row">
            <button class="btn-secondary" onclick="gerarCompartilhamento()">Gerar link & QR</button>
            <button class="btn-success" onclick="copiarLink()" id="btn-copiar" style="display:none">Copiar link</button>
        </div>
        <div class="link-row" id="link-row" style="display:none">
            <input type="text" id="link-output" readonly onclick="this.select()">
        </div>
        <div id="qr-wrapper">
            <div id="qr-container"></div>
        </div>
        <div class="toast" id="toast">Link copiado!</div>
    </div>

    <!-- JOGADORES -->
    <h2>Jogadores</h2>
    <label for="qtd-jogadores">Quantidade de jogadores</label>
    <input type="number" placeholder="Ex: 4" id="qtd-jogadores" min="1" oninput="renderJogadores()">

    <div class="jogadores-lista" id="jogadores-lista"></div>

    <button onclick="calcularDistribuicao()" style="margin-top:22px">Calcular distribuição</button>

    <div class="total" id="total"></div>
</div>

<script>
    let fichas = []
    let qrGerado = false

    const valorAdd = document.getElementById("valor-add")
    const qtdAdd = document.getElementById("qtd-add")
    const fichasLista = document.getElementById('fichas-lista')
    const totalContainer = document.getElementById('total')
    const qtdJogadores = document.getElementById('qtd-jogadores')
    const jogadoresLista = document.getElementById('jogadores-lista')

    // Carrega maleta da URL ao abrir a página
    window.addEventListener('load', () => {
        const params = new URLSearchParams(window.location.search)
        if (params.has('maleta')) {
            try {
                fichas = JSON.parse(atob(params.get('maleta')))
                renderFichas()
            } catch(e) {}
        }
    })

    function adicionarFicha() {
        const valor = Number(valorAdd.value)
        const qtd = Number(qtdAdd.value)

        if (!Number.isFinite(valor) || !Number.isFinite(qtd) || valor <= 0 || qtd <= 0) {
            alert('Preencha corretamente o valor e a quantidade da ficha!')
            return
        }

        const existente = fichas.findIndex(f => f.valor === valor)
        if (existente >= 0) {
            fichas[existente].qtd += qtd
        } else {
            fichas.push({ valor, qtd })
            fichas.sort((a, b) => a.valor - b.valor)
        }

        valorAdd.value = ''
        qtdAdd.value = ''
        renderFichas()
        resetCompartilhamento()
    }

    function removerFicha(index) {
        fichas.splice(index, 1)
        renderFichas()
        resetCompartilhamento()
    }

    function renderFichas() {
        fichasLista.innerHTML = ''
        fichas.forEach((ficha, i) => {
            const div = document.createElement('div')
            div.className = 'ficha-item'
            div.innerHTML = `
                <span>${ficha.qtd} ficha(s) de <b>${ficha.valor}</b></span>
                <button class="remove-btn" onclick="removerFicha(${i})" title="Remover">✕</button>
            `
            fichasLista.appendChild(div)
        })
    }

    function gerarLink() {
        const base64 = btoa(JSON.stringify(fichas))
        return `${window.location.origin}${window.location.pathname}?maleta=${base64}`
    }

    function gerarCompartilhamento() {
        if (fichas.length === 0) {
            alert('Adicione fichas à maleta antes de gerar o link!')
            return
        }

        const url = gerarLink()

        const linkOutput = document.getElementById('link-output')
        const linkRow = document.getElementById('link-row')
        const btnCopiar = document.getElementById('btn-copiar')
        const qrWrapper = document.getElementById('qr-wrapper')
        const qrContainer = document.getElementById('qr-container')

        linkOutput.value = url
        linkRow.style.display = 'flex'
        btnCopiar.style.display = 'block'

        qrContainer.innerHTML = ''
        new QRCode(qrContainer, {
            text: url,
            width: 200,
            height: 200,
            colorDark: '#23272f',
            colorLight: '#f5f6fa',
            correctLevel: QRCode.CorrectLevel.M
        })
        qrWrapper.classList.add('visible')
        qrGerado = true
    }

    function copiarLink() {
        const url = document.getElementById('link-output').value
        if (!url) return
        navigator.clipboard.writeText(url).then(() => {
            const toast = document.getElementById('toast')
            toast.classList.remove('show')
            void toast.offsetWidth
            toast.classList.add('show')
        })
    }

    function resetCompartilhamento() {
        document.getElementById('link-row').style.display = 'none'
        document.getElementById('btn-copiar').style.display = 'none'
        document.getElementById('qr-wrapper').classList.remove('visible')
        document.getElementById('link-output').value = ''
        qrGerado = false
    }

    function renderJogadores() {
        const n = parseInt(qtdJogadores.value)
        if (!n || n <= 0) {
            jogadoresLista.innerHTML = ''
            return
        }

        const atual = jogadoresLista.querySelectorAll('.jogador-row').length

        if (n > atual) {
            for (let i = atual + 1; i <= n; i++) {
                const row = document.createElement('div')
                row.className = 'jogador-row'
                row.innerHTML = `
                    <span class="jogador-label">J${i}</span>
                    <input type="text" placeholder="Nome (opcional)" id="nome-j${i}">
                    <input type="number" placeholder="Aposta (R$)" id="aposta-j${i}" min="1">
                `
                jogadoresLista.appendChild(row)
            }
        } else {
            for (let i = atual; i > n; i--) {
                jogadoresLista.removeChild(jogadoresLista.lastChild)
            }
        }
    }

    function calcularDistribuicao() {
        const n = parseInt(qtdJogadores.value)

        if (!n || n <= 0) {
            totalContainer.innerHTML = '<p style="color:#ff7675">Informe a quantidade de jogadores!</p>'
            return
        }
        if (fichas.length === 0) {
            totalContainer.innerHTML = '<p style="color:#ff7675">Adicione ao menos um tipo de ficha!</p>'
            return
        }

        const jogadores = []
        for (let i = 1; i <= n; i++) {
            const nome = document.getElementById(`nome-j${i}`)?.value.trim() || `Jogador ${i}`
            const aposta = Number(document.getElementById(`aposta-j${i}`)?.value)
            if (!aposta || aposta <= 0) {
                totalContainer.innerHTML = `<p style="color:#ff7675">Informe o valor de aposta do ${nome}!</p>`
                return
            }
            jogadores.push({ nome, aposta })
        }

        const totalValorMaleta = fichas.reduce((acc, f) => acc + f.valor * f.qtd, 0)
        const totalApostas = jogadores.reduce((acc, j) => acc + j.aposta, 0)

        if (totalValorMaleta <= 0) {
            totalContainer.innerHTML = '<p style="color:#ff7675">Fichas insuficientes para distribuir!</p>'
            return
        }

        // Valor real de cada unidade de denominação de ficha
        const valorUnidade = totalApostas / totalValorMaleta

        // Estoque de fichas disponível (do maior para o menor, para greedy)
        const estoque = fichas
            .map(f => ({ valor: f.valor, qtd: f.qtd }))
            .sort((a, b) => b.valor - a.valor)

        // Aloca fichas por jogador, do maior apostador para o menor
        const ordem = jogadores
            .map((j, idx) => ({ ...j, idx }))
            .sort((a, b) => b.aposta - a.aposta)

        const alocacoes = new Array(n)

        ordem.forEach(j => {
            let cota = Math.round(j.aposta / valorUnidade) // valor de denominação que este jogador deve receber
            const chips = {}

            estoque.forEach(f => {
                const qtd = Math.min(Math.floor(cota / f.valor), f.qtd)
                if (qtd > 0) {
                    chips[f.valor] = qtd
                    f.qtd -= qtd
                    cota -= qtd * f.valor
                }
            })

            const totalDenominacao = Object.entries(chips).reduce((acc, [v, q]) => acc + Number(v) * q, 0)
            alocacoes[j.idx] = { chips, totalReal: totalDenominacao * valorUnidade }
        })

        const maiorAposta = Math.max(...jogadores.map(j => j.aposta))
        let html = `
            <p>Valor unitário da ficha <span style="color:#b2bec3;font-weight:400;font-size:0.9rem">(maior aposta R$ ${maiorAposta})</span></p>
            <div style="color:#ffe082; font-size:1.2rem; font-weight:bold; margin-bottom:16px">R$ ${valorUnidade.toFixed(4)}</div>
            <p>Fichas por jogador:</p>
        `

        jogadores.forEach((j, idx) => {
            const { chips, totalReal } = alocacoes[idx]

            const fichasHtml = fichas
                .slice()
                .sort((a, b) => b.valor - a.valor)
                .map(f => {
                    const qtd = chips[f.valor] || 0
                    return `<span style="color:${qtd > 0 ? '#ffe082' : '#636e72'}">${qtd}x <b>${f.valor}</b></span>`
                })
                .join(' &nbsp;|&nbsp; ')

            html += `
                <div class="jogador-resultado">
                    <div class="nome">${j.nome} <span style="color:#b2bec3;font-weight:400">— aposta R$ ${j.aposta}</span></div>
                    <div class="detalhe" style="margin:6px 0;font-size:1rem;line-height:1.8">${fichasHtml}</div>
                    <div class="detalhe">Valor das fichas: <b style="color:#ffe082">R$ ${totalReal.toFixed(2)}</b></div>
                </div>
            `
        })

        // Fichas que sobraram na maleta
        const sobras = estoque.filter(f => f.qtd > 0)
        if (sobras.length > 0) {
            const sobrasHtml = sobras.map(f => `${f.qtd}x ${f.valor}`).join(', ')
            html += `<div style="margin-top:10px;color:#636e72;font-size:0.85rem">Fichas não distribuídas: ${sobrasHtml}</div>`
        }

        totalContainer.innerHTML = html
    }
</script>

</body>
</html>
